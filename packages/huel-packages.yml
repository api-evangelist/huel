summary: >-
  Huel publishes three PHP packages on Packagist under the huel-global vendor
  namespace, matching its GitHub organisation. All three are CLIENT LIBRARIES FOR
  THIRD-PARTY APIS that Huel consumes as a merchant (Recharge Payments, Trustpilot,
  Shopify) - they are NOT SDKs for a Huel API, because Huel has no API. No `SDKs`
  pointer is wired into apis.yml for that reason: the sdk_count check measures client
  libraries for the provider's own API, and awarding it here would misrepresent Huel
  as an API provider. Nothing first-party was found on npm, PyPI, RubyGems, NuGet,
  Maven Central, pkg.go.dev or crates.io.
