aid: huel
name: Huel
description: 'Huel (a contraction of "Human Fuel") is a British nutritionally-complete
  food company founded in June 2015 by Julian Hearn with nutritionist James Collier,
  headquartered in Tring, Hertfordshire, and operating offices in the UK, US and Europe.
  It sells plant-based, nutritionally complete powders, ready-to-drink shakes, hot
  and savoury instant meals, bars and supplements direct to consumers in more than
  100 countries, reporting GBP 214 million of revenue in FY2024. Danone SA agreed to
  acquire Huel in March 2026 in a deal reported at roughly EUR 1 billion / USD 1.1
  billion. Huel is a direct-to-consumer commerce and subscription business, not an
  API provider: it publishes no developer portal, no API documentation and no
  machine-readable API contract. Its storefront runs as a Next.js application on
  Vercel in front of a Shopify commerce backend; the only anonymously callable
  machine-readable surface observed on a Huel-controlled host is the standard
  Discourse platform REST API served by its North American customer community at
  discourse.huel.com.'
