apis:
- aid: huel:community
  name: Huel Community API (Discourse)
  description: 'The Huel US customer forum at discourse.huel.com runs Discourse
    2026.8.0 and therefore serves the standard Discourse REST API on a Huel-controlled
    host. Anonymous GET requests to /site.json, /categories.json, /latest.json and
    /about.json return real JSON (verified 2026-08-01). This is the Discourse
    platform contract, not an API Huel authored, documented or supports: Huel
    publishes no reference for it and offers no developer programme. Recorded here
    because it is the only anonymously callable machine-readable surface found across
    every Huel host probed.'
