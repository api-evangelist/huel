  apis.yml, because no document exists to point at.
caveat: >-
  huel.com and its locale hosts are a Next.js application on Vercel with a catch-all
  route: any unmatched path returns HTTP 200 with the ~928KB HTML homepage shell.
  /llms.txt, /security.txt and /openapi.json all answer 200 text/html with that same
  shell and are therefore FALSE POSITIVES, recorded below as false_positive: true.
  Only /.well-known/* paths return a true 404 on that host. discourse.huel.com and
  careers.huel.com return honest 404 HTML error pages.
